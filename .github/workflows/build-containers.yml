name: Singularity Build (docker)
on:
  push:
    branches:
      - master
  release:
    types:
      - published

jobs:
  build-test-containers:
    runs-on: ubuntu-latest
    strategy:
      # Keep going on other deployments if anything bloops
      fail-fast: false
      matrix:
        program:
          - 'mrchem'
        variant:
          - 'nompi'
          - 'openmpi4.0'

    name: Build ${{ matrix.program }}-${{ matrix.variant }}
    steps:
      - name: Check out code for the container builds
        uses: actions/checkout@v4

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build container
        env:
          image_name: ${{ matrix.program }}_${{ matrix.variant }}
          recipe_name: Singularity.${{ matrix.variant }}
        run: |
          echo "Building ${{ matrix.program }} ${{ matrix.variant }}"
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"
          echo "IMAGE_NAME=$image_name" >> $GITHUB_ENV

          # build container
          sudo -E apptainer build container.sif recipes/"$recipe_name"
          # the root build leaves root-owned files in ~/.apptainer, which breaks the unprivileged login/push
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.apptainer"

          # determine release tag
          if [[ ${GITHUB_EVENT_NAME} == "release" ]]; then
            # give release events tag "vX.Y.Z" (GITHUB_REF=refs/tags/vX.Y.Z)
            tag=$(basename $GITHUB_REF)
          else
            # give push events on master tag "latest"
            tag="latest"
          fi

          # Build the container and name by tag
          echo "TAG=$tag" >> $GITHUB_ENV

      - name: Login and deploy container
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | apptainer registry login -u ${{ secrets.GHCR_USERNAME }} --password-stdin oras://ghcr.io
          echo "Pushing $IMAGE_NAME with tag $TAG"
          apptainer push container.sif oras://ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}:${TAG}
